<html lang="zh-Hant"><head><meta charset="utf-8">

<title>核緣閣</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>

.btn{font:inherit;background:linear-gradient(#b13a2a,#8a2418);color:#f6e7c1;border:1px solid #4d120a;border-radius:3px;padding:6px 14px;cursor:pointer;box-shadow:0 2px 0 #4d120a,inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(2px);box-shadow:none}

.btn.alt{background:linear-gradient(#5c8c68,#3d6448);border-color:#22402b;box-shadow:0 2px 0 #22402b}
.btn.dk{background:linear-gradient(#7a5c38,#5a4023);border-color:#2f200f;box-shadow:0 2px 0 #2f200f}

.wn{cursor:pointer}.wn.sel{outline:3px solid var(--red);background:#e9c9a0}
.lot canvas,.wn canvas{width:96px;height:96px}
.lot.sold{opacity:.45}
.b{color:var(--red)}
.md{position:fixed;inset:0;background:rgba(15,7,3,.85);display:none;align-items:center;justify-content:center;z-index:40;padding:12px}
.md.on{display:flex}

.bar{display:flex;align-items:center;gap:8px;text-align:left;font-size:14px;margin:3px 0}
.bar i{flex:0 0 90px;height:8px;background:#c9b88d;border-radius:4px;overflow:hidden}
.bar i u{display:block;height:100%;background:var(--jade)}

.foot{text-align:center;margin:16px 0;color:#a88852;font-size:13px}
.foot a{color:#d9b46a;cursor:pointer;text-decoration:underline;margin:0 8px}
.pg{height:8px;background:#c9b88d;border-radius:4px;overflow:hidden;margin:6px 0}.pg u{display:block;height:100%;background:var(--gold)}
@media (max-width:520px){.frame{grid-template-columns:20px 1fr 20px}main{padding:18px 10px}.plq{font-size:30px;padding:2px 14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const $=s=>document.querySelector(s);

${roof(200,100,66)}${body(200,104,56,40,4)}${roof(200,160,88)}${body(200,164,74,50,5)}${roof(200,230,112)}${body(200,234,92,76,6)}

<path d="M92 328h216v14H92z" fill="#8f8776" stroke="#4d4538"/><path d="M76 342h248v14H76z" fill="#aaa28f" stroke="#4d4538"/><path d="M60 356h280v16H60z" fill="#8f8776" stroke="#4d4538"/>
${[0,1,2,3].map(i=>`<circle cx="${96+i*70}" cy="${322}" r="0"/>`).join('')}
<g fill="#a52a1c" stroke="#d3a64a"><circle cx="110" cy="248" r="9"/><circle cx="290" cy="248" r="9"/></g><path d="M110 226v13M290 226v13" stroke="#d3a64a"/>
<ellipse cx="200" cy="396" rx="190" ry="20" fill="#1a0b08" opacity=".5"/></svg>`}
const TY={'獅子頭':{b:120,ax:1.1,ay:.88,top:0,flat:0,sz:[34,44]},'虎頭':{b:160,ax:.92,ay:1.05,top:.2,flat:0,sz:[36,48]},'官帽':{b:140,ax:1,ay:.96,top:.1,flat:.18,sz:[36,46]},'公子帽':{b:180,ax:.82,ay:1.1,top:.24,flat:.1,sz:[35,45]},'楸子':{b:40,ax:.86,ay:.96,top:0,flat:0,sz:[26,34]},'鐵核桃':{b:25,ax:.96,ay:.94,top:0,flat:0,sz:[28,36]}};

const SC=['小','中','大'],TX=['疏紋','中紋','密紋'];
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k)),rgb=a=>`rgb(${a})`,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rr=(a,b)=>a+Math.random()*(b-a),ri=a=>a[Math.floor(Math.random()*a.length)],gs=()=>Math.random()+Math.random()+Math.random()-1.5;
const MAXP=5,BRK=.08,ENTRY=10000;
let S,tab=0,raf=0,sel=new Set();
function load(){try{const j=localStorage.getItem('hgy3');if(j)return JSON.parse(j)}catch(e){}return null}

function fresh(){S={gold:200,day:1,lots:[],orders:[],nuts:[],walnuts:[],pairs:[],crafts:[],auction:[],id:1};genMarket();genOrders();genAuction();sel.clear()}
function val(w){const p=TY[w.type],m=.3+(w.q+w.s)/20*1.4,sf=Math.pow(w.size/((p.sz[0]+p.sz[1])/2),2),cf=1+w.c*.1+(w.c>=8?.25:0);return Math.max(1,Math.round(p.b*m*sf*cf*(w.perfect?1.1:1)*Math.pow(.8,w.breaks)*(w.mult||1)))}
const pitems=p=>[p.a,p.b,p.c,p.d].filter(Boolean),pval=p=>Math.round(pitems(p).reduce((s,w)=>s+val(w),0)*[0,0,1.4,1.6,1.8][pitems(p).length]);
function genLot(pm){const o=ri(Object.keys(ORG)),sc=Math.floor(Math.random()*3),tx=Math.floor(Math.random()*3);return{id:S.id++,o,sc,tx,price:Math.round(ORG[o].b*[.8,1.2,1.8][sc]*[.9,1.15,1.5][tx]*pm*rr(.95,1.05)),sold:false}}
function genMarket(){const pm=rr(.85,1.2);S.lots=[...Array(6)].map(()=>genLot(pm))}
function pickW(w){let r=Math.random();for(const k in w){if((r-=w[k])<=0)return k}return Object.keys(w)[0]}
function gen(l){const O=ORG[l.o],ty=pickW(O.w),p=TY[ty],t=(l.sc+Math.random())/3,rare=Math.random()<.03&&ty!=='鐵核桃';
return{id:S.id++,type:ty,origin:l.o,q:cl(Math.round(5+O.qb+gs()*2.2+(rare?3:0)),1,10),s:cl(Math.round(3+l.tx*2.3+gs()*1.6+(rare?3:0)),1,10),size:+(p.sz[0]+(p.sz[1]-p.sz[0])*t).toFixed(1),c:+rr(.3,1.2).toFixed(1),seed:Math.floor(Math.random()*1e6),breaks:0,plays:0,perfect:false,mult:rare?+rr(6,40).toFixed(1):0}}
function genOrders(){S.orders=[];const ks=Object.keys(TY);for(let i=0;i<3;i++){const r=Math.random();let o;
if(r<.4){const t=Math.random()<.3?'任意':ri(ks),b=t==='任意'?70:TY[t].b,rg=t==='任意'?[30,44]:TY[t].sz,min=Math.round(rr(rg[0]+1,rg[1]-1));o={k:'w',type:t,min,reward:Math.round(b*Math.pow(min/36,2)*1.5/5)*5}}
else if(r<.65){const t=ri(ks),rg=TY[t].sz,min=Math.round(rr(rg[0]+1,rg[1]-2));o={k:'p',type:t,min,reward:Math.round(TY[t].b*Math.pow(min/36,2)*4.2/5)*5}}
else{const kind=ri(['手鏈','項鍊']),same=Math.random()<.3,min=Math.round((kind==='手鏈'?rr(150,500):rr(300,1000))/10)*10;o={k:'c',kind,same,min,reward:Math.round(min*1.25*(same?1.4:1)/5)*5}}
o.done=false;S.orders.push(o)}}
function genAuction(){S.auction=[];for(let i=0;i<5;i++){const w=gen({o:ri(Object.keys(ORG)),sc:Math.floor(Math.random()*3),tx:Math.floor(Math.random()*3)});w.perfect=true;w.mult=1;w.mult=Math.exp(rr(Math.log(30),Math.log(100000)))/val(w);w.auc=1;S.auction.push({w,price:Math.round(rr(20000,60000)/100)*100,sold:false})}}
function shape(x,cx,cy,r,w){const p=TY[w.type],R=rng(w.seed),ph=R()*6;x.beginPath();for(let i=0;i<=60;i++){const t=i/60*6.2832,c=Math.cos(t),s=Math.sin(t),k=1+.025*Math.sin(5*t+ph)+.02*Math.sin(9*t+ph*2),px=cx+r*p.ax*s*(1-p.top*Math.max(0,c))*k,py=cy-r*p.ay*c*(c>0?1-p.flat:1)*k;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}
function drawW(x,cx,cy,r,w){const p=TY[w.type],ty=w.type,k=w.c/10,lo=mix([226,203,150],[150,70,30],k),hi=mix([242,224,178],[210,125,62],k),dk=mix([170,140,95],[70,25,10],k),glow=w.c>=8,dn=Math.round(w.s/2);
x.save();shape(x,cx,cy,r,w);x.shadowColor=glow?'rgba(255,170,60,.85)':'rgba(0,0,0,.4)';x.shadowBlur=glow?22:10;x.shadowOffsetY=glow?0:4;

x.save();shape(x,cx,cy,r,w);x.clip();const R=rng(w.seed+7);x.lineCap='round';
const mer=(a,wg,lw,al,ph)=>{x.beginPath();for(let i=0;i<=24;i++){const u=i/24,c=Math.cos(Math.PI*u),s=Math.sin(Math.PI*u),px=cx+r*p.ax*a*s*(1-p.top*Math.max(0,c))+Math.sin(u*14+ph)*wg*r,py=cy-r*p.ay*c*(c>0?1-p.flat:1);i?x.lineTo(px,py):x.moveTo(px,py)}x.lineWidth=lw;x.strokeStyle=`rgba(35,12,4,${al})`;x.stroke();x.translate(lw*.9,-lw*.3);x.strokeStyle=`rgba(255,235,190,${al*.45})`;x.stroke();x.translate(-lw*.9,lw*.3)};
